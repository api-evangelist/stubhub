aid: stubhub
name: StubHub
description: StubHub is the world's largest secondary-market ticket marketplace, connecting buyers and
  sellers of tickets to sports, concerts, theater, and live events. Its official developer platform (developer.stubhub.com,
  migrated to a v2 API in 2022 on api.stubhub.net) exposes five partner-gated REST APIs — Account, Catalog,
  Inventory, Sales, and Webhooks — that let approved affiliate and seller-integration partners search
  events, create and manage seller listings, upload e-tickets, fulfill sales and shipments, view payments,
  and subscribe to event webhooks. All resources use the application/hal+json (HAL) media type and OAuth2
  (client-credentials and authorization-code flows). StubHub is a viagogo company and its official GogoKit
  SDKs (.NET, Ruby) target the shared HAL API.
